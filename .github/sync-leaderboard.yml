name: Sync Leaderboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch leaderboard from Cloudflare Worker
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          if ! curl -sS -m 30 -A "$UA" -o leaderboard.json "https://2048-game.lixia-325520.workers.dev/api/leaderboard"; then
            curl -sS -m 30 -A "$UA" -o leaderboard.json "https://2048-leaderboard.lixia-325520.workers.dev/api/leaderboard"
          fi
          python3 - <<'PY'
          import json, time
          d = json.load(open('leaderboard.json'))
          assert d.get('ok') is True and isinstance(d.get('list'), list), '格式错误: ' + json.dumps(d)[:200]
          lst = [{'n': str(x.get('n','')), 's': int(x.get('s',0)), 't': x.get('t', int(time.time()*1000))} for x in d['list'][:50]]
          json.dump({'ok': True, 'list': lst, 'syncedAt': int(time.time()*1000)}, open('leaderboard.json','w'), ensure_ascii=False)
          print('同步成功, 共', len(lst), '条')
          PY

      - name: Commit and push
        run: |
          git config user.name "lixia325520-hub"
          git config user.email "lixia325520-hub@users.noreply.github.com"
          git add leaderboard.json
          if git diff --cached --quiet; then
            echo "榜单无变化，跳过提交"
          else
            git commit -m "chore: 同步排行榜 $(date -u '+%m/%d %H:%M')"
            git push
          fi
