<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048予阳大帝</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#141021;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  .wrap { width:min(92vw,420px); }
  .title {
    text-align:center; color:#fff; font-size:clamp(30px,9vw,46px); font-weight:900;
    text-shadow:0 3px 10px rgba(0,0,0,.7), 0 0 30px rgba(255,215,0,.55);
    letter-spacing:2px; margin-bottom:12px; white-space:nowrap;
  }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .score-box { background:rgba(0,0,0,.45); border-radius:10px; padding:6px 14px; color:#fff; text-align:center; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); flex:1; }
  .score-box b { font-size:20px; display:block; }
  .score-box span { font-size:11px; opacity:.85; }
  .btn { background:linear-gradient(135deg,#f2b179,#f65e3b); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .btn:active { transform:scale(.95); }
  .board { position:relative; background:rgba(0,0,0,.45); border-radius:12px; padding:10px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .cell { aspect-ratio:1; background:rgba(255,255,255,.14); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(20px,6vw,34px); color:#fff; }
  .t2{background:#eee4da;color:#776e65}.t4{background:#ede0c8;color:#776e65}
  .t8{background:#f2b179;color:#fff}.t16{background:#f59563;color:#fff}
  .t32{background:#f67c5f;color:#fff}.t64{background:#f65e3b;color:#fff}
  .t128{background:#edcf72;color:#fff}.t256{background:#edcc61;color:#fff}
  .t512{background:#edc850;color:#fff}.t1024{background:#edc53f;color:#fff}
  .t2048{background:#edc22e;color:#fff;box-shadow:0 0 22px rgba(237,194,46,.85)}
  .t4096{background:#3c3a32;color:#fff}.t8192{background:#2b2a39;color:#ffd700;box-shadow:0 0 22px rgba(255,215,0,.65)}.t16384{background:#1a1830;color:#fff;box-shadow:0 0 28px rgba(255,85,85,.7)}
  .overlay { position:absolute; inset:0; background:rgba(0,0,0,.6); border-radius:12px; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:#fff; z-index:10; text-align:center; }
  .overlay.show{display:flex}
  .overlay h2{font-size:26px; text-shadow:0 2px 6px #000; padding:0 12px;}
  .tip { text-align:center; color:#fff; font-size:12px; margin-top:10px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal.show{display:flex}
  .modal-box { width:min(88vw,360px); background:rgba(20,18,16,.94); border-radius:16px; padding:24px 20px; text-align:center; color:#fff; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .modal-box h2 { font-size:22px; margin-bottom:16px; }
  .modal-box input { width:100%; padding:12px; border-radius:10px; border:2px solid #f2b179; background:rgba(255,255,255,.1); color:#fff; font-size:16px; text-align:center; outline:none; margin-bottom:16px; }
  .modal-box input::placeholder{color:rgba(255,255,255,.4)}
  .modal-box .btn { width:100%; }
  .rank-list { max-height:280px; overflow-y:auto; margin-bottom:16px; }
  .rank-row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
  .rank-no { width:22px; height:22px; border-radius:50%; background:#f2b179; color:#3a2c1c; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rank-name { flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-score { font-weight:800; color:#ffd700; }
  .rank-time { font-size:11px; opacity:.6; }
  .rank-empty { padding:20px 0; opacity:.6; font-size:14px; }

  #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
html,body{overflow:hidden;height:100%;overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="title">2048予阳大帝</div>
  <div class="bar">
    <div class="score-box"><b id="score">0</b><span>得分</span></div>
    <div class="score-box"><b id="best">0</b><span>最高分</span></div>
    <button class="btn" onclick="newGame()">重开</button>
    <button class="btn" onclick="showRank()">排行</button>
  </div>
  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">游戏结束</h2>
      <button class="btn" id="ovBtn" onclick="ovBtnClick()">再来一局</button>
    </div>
  </div>
  <div class="tip">键盘 ← ↑ ↓ → 或 滑动屏幕 控制方块</div>
</div>
<div class="modal" id="nameModal">
  <div class="modal-box">
    <h2>🐳 报上名来，杂鱼！</h2>
    <input id="nameInput" maxlength="8" placeholder="输入你的名字">
    <button class="btn" onclick="startWithName()">开始游戏</button>
  </div>
</div>
<div class="modal" id="rankModal">
  <div class="modal-box">
    <h2>🏆 排行榜 <span id="rankTag" style="font-size:12px;opacity:.75"></span></h2>
    <div class="rank-list" id="rankList"></div>
    <input id="apiInput" placeholder="服务器地址，如 http://192.168.1.5:8081" style="margin-bottom:8px">
    <button class="btn" onclick="saveApi()">保存服务器地址</button>
    <button class="btn" onclick="closeRank()" style="margin-top:8px">关闭</button>
  </div>
</div>
<script>
var store = {
  get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
var size = 4, board = [], score = 0, best = parseInt(store.get('best2048')||'0', 10) || 0;
var playerName = store.get('playerName') || '';
var API = store.get('api2048') || '';
if(!API && location.hostname){ API = location.protocol + '//' + location.hostname + ':8081'; }
var grid = document.getElementById('grid'), cells = [];
function buildBoard(){
  for(var i=0;i<size*size;i++){ var d=document.createElement('div'); d.className='cell'; grid.appendChild(d); cells.push(d); }
  document.getElementById('best').textContent = best;
  var n = document.getElementById('nameInput');
  if(playerName){ n.value = playerName; n.placeholder = '上次愜惟：' + playerName; }
  document.getElementById('nameModal').classList.add('show');
}
function startWithName(){
  var n = document.getElementById('nameInput').value.trim();
  if(!n){ document.getElementById('nameInput').focus(); return; }
  playerName = n; store.set('playerName', n);
  document.getElementById('nameModal').classList.remove('show');
  newGame();
}
function newGame(){
  board = [];
  for(var r=0;r<size;r++){ board.push([]); for(var c=0;c<size;c++) board[r].push(0); }
  score = 0; document.getElementById('score').textContent = 0;
  document.getElementById('overlay').classList.remove('show');
  addTile(); addTile(); render();
}
function addTile(){
  var empty = [];
  for(var r=0;r<size;r++) for(var c=0;c<size;c++) if(!board[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  var p = empty[Math.floor(Math.random()*empty.length)];
  board[p[0]][p[1]] = Math.random()<0.9 ? 2 : 4;
}
function render(){
  for(var i=0;i<cells.length;i++){
    var v = board[Math.floor(i/size)][i%size];
    cells[i].textContent = v || '';
    cells[i].className = 'cell' + (v ? ' t'+v : '');
  }
}
function move(dir){
  var moved = false;
  for(var i=0;i<size;i++){
    var line = [];
    for(var j=0;j<size;j++){
      var r,c;
      if(dir===0){r=i;c=j;} else if(dir===1){r=j;c=i;}
      else if(dir===2){r=i;c=size-1-j;} else {r=size-1-j;c=i;}
      if(board[r][c]) line.push(board[r][c]);
    }
    var merged = [];
    for(var k=0;k<line.length;k++){
      if(k+1<line.length && line[k]===line[k+1]){ merged.push(line[k]*2); score += line[k]*2; k++; }
      else merged.push(line[k]);
    }
    while(merged.length<size) merged.push(0);
    for(var j2=0;j2<size;j2++){
      var r2,c2;
      if(dir===0){r2=i;c2=j2;} else if(dir===1){r2=j2;c2=i;}
      else if(dir===2){r2=i;c2=size-1-j2;} else {r2=size-1-j2;c2=i;}
      if(board[r][c2] !== merged[j2]) moved = true;
      board[r2][c2] = merged[j2];
    }
  }
  if(moved){
    addTile(); render();
    document.getElementById('score').textContent = score;
    if(score > best){ best = score; store.set('best2048', best); document.getElementById('best').textContent = best; }
  }
  check();
}
function check(){
  var c2048 = 0, c4096 = 0, canMove = false;
  for(var r=0;r<size;r++) for(var c=0;c<size;c++){
    var v = board[r][c];
    if(v === 2048) c2048++;
    if(v >= 4096) c4096++;
    if(!v){ canMove = true; continue; }
    if(c+1<size && board[r][c+1]===v) canMove = true;
    if(r+1<size && board[r+1][c]===v) canMove = true;
  }
  if(c2048 >= 1 || c4096 >= 1){ saveScore(); showOverlay('🎉 不可以！不可以！我不行了，你赢了！', true); }
  else if(!canMove){ saveScore(); showOverlay('💀 ' + failMsg(score), true); }
}
function failMsg(s){
  if(s <= 2000) return '杂鱼杂鱼';
  if(s <= 5000) return '杂鱼不行啊';
  if(s <= 7000) return '加劲呢杂鱼酱�;
  if(s <= 10000) return '加把劲呢杂鱼酱';
  return '不行了，你赢了';
}
function saveScore(){
  if(!playerName) return;
  try {
    var list = JSON.parse(store.get('leader2048')||'[]');
    if(!(list instanceof Array)) list = [];
    var d = new Date();
    var mm = d.getMonth()+1, dd = d.getDate(), hh = d.getHours(), mi = d.getMinutes();
    var newEntry = {n:playerName, s:score, t:(mm<10?'0':'')+mm+'/'+(dd<10?'0':'')+dd+' '+(hh<10?'0':'')+hh+':'+(mi<10?'0':'')+mi};
    // 去重：同名玩家只还留最高分
    var exist = -1;
    for(var i=0;i<list.length;i++){ if(list[i].n===playerName){ exist=i; break; } }
    if(exist>=0){ if(score>list[exist].s) list[exist]=newEntry; }
    else list.push(newEntry);
    list.sort(function(a,b){ return b.s - a.s; });
    if(list.length > 10) list = list.slice(0,10);
    store.set('leader2048', JSON.stringify(list));
    if(API){
      try {
        fetch(API + '/api/score', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:playerName, score:score})});
      } catch(e){ console.warn('API score push failed:', e); }
    }
  } catch(e){ console.warn('saveScore failed:', e); alert('存储空间不足或数据异常，排行榜无法保存；请清理浏览器存储后重试。'); }
}
function showRank(){
  document.getElementById('rankModal').classList.add('show');
  document.getElementById('apiInput').value = API;
  var box = document.getElementById('rankList');
  var local = getLocalRank();
  renderRank(local, false);
  var ub = 'https://lixia325520-hub.github.io/2048/leaderboard.json?x=' + Date.now();
  function mergeAndRender(remoteList){
    if(!remoteList || !remoteList.length || !local.length){ renderRank(remoteList||local, true); return; }
    var map = {}, merged = [];
    for(var i=0;i<remoteList.length;i++){ map[remoteList[i].n]=remoteList[i]; merged.push(remoteList[i]); }
    for(var j=0;j<local.length;j++){
      var ln = local[j].n;
      if(!map[ln]) merged.push(local[j]);
      else if(local[j].s > map[ln].s){ merged.splice(merged.indexOf(map[ln]), 1, local[j]); map[ln]=local[j]; }
    }
    merged.sort(function(a,b){ return b.s - a.s; });
    if(merged.length > 10) merged = merged.slice(0,10);
    renderRank(merged, true);
  }
  try {
    var ctrl = new AbortController(), t = setTimeout(function(){ ctrl.abort(); }, 4000);
    fetch(ub, {signal:ctrl.signal}).then(function(r){ return r.json(); }).then(function(j){
      clearTimeout(t);
      if(j && j.ok && j.list) mergeAndRender(j.list);
    }).catch(function(e){ try{ clearTimeout(t); }catch(e){} console.warn('GitHub leaderboard fetch failed:', e); });
  } catch(e){}
  if(API){
    try {
      fetch(API + '/api/leaderboard').then(function(r){ return r.json(); }).then(function(j){
        if(j && j.ok && j.list) mergeAndRender(j.list);
      }).catch(function(err){ console.warn('Custom API leaderboard fetch failed:', err); });
    } catch(e){ console.warn('Custom API leaderboard error:', e); }
  }
}
function getLocalRank(){
  try { var l = JSON.parse(store.get('leader2048')||'[]'); return (l instanceof Array) ? l : []; } catch(e){ return []; }
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'&#39;');
}
function renderRank(list, isServer){
  var html = '';
  if(!list || !list.length){ html = '<div class="rank-empty">暂无记录，快来创造神话吧~</div>'; }
  else {
    for(var i=0;i<list.length;i++){
      html += '<div class="rank-row"><span class="rank-no">'+(i+1)+'</span><span class="rank-name">'+escapeHtml(list[i].n)+'</span><span class="rank-score">'+escapeHtml(list[i].s)+'</span><span class="rank-time">'+escapeHtml(list[i].t||'')+'</span></div>';
    }
  }
  document.getElementById('rankList').innerHTML = html;
  document.getElementById('rankTag').textContent = isServer ? '🌐 全服排行' : '📱 本机排行';
}
function saveApi(){
  var v = document.getElementById('apiInput').value.trim();
  if(v){ store.set('api2048', v); API = v; }
  else { store.set('api2048', ''); API = location.hostname ? location.protocol + '//' + location.hostname + ':8081' : ''; }
  showRank();
}
function closeRank(){ document.getElementById('rankModal').classList.remove('show'); }
function showOverlay(title, isOver){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovBtn').textContent = isOver ? '再来一局' : '继续挑战';
  document.getElementById('overlay').dataset.over = isOver ? '1' : '0';
  document.getElementById('overlay').classList.add('show');
}
function ovBtnClick(){
  var o = document.getElementById('overlay');
  if(o.dataset.over === '1'){ newGame(); } else { o.classList.remove('show'); }
}
document.addEventListener('keydown', function(e){
  if(e.target && e.target.tagName === 'INPUT'){ if(e.key === 'Enter') startWithName(); return; }
  if(document.querySelector('.modal.show')) return;
  var map = {ArrowLeft:0, ArrowUp:1, ArrowRight:2, ArrowDown:3, a:0, w:1, d:2, s:3, A:0, W:1, D:2, S:3};
  if(map[e.key] !== undefined){ e.preventDefault(); move(map[e.key]); }
});
var sx = 0, sy = 0;
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', function(e){
  if(document.querySelector('.modal.show')) return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 3 : 1);
}, {passive:true});

var BGS=["bg/bg1.png","bg/bg2.jpg","bg/bg3.png","bg/bg4.png"];

var cvs = document.getElementById('bgCanvas');
var ctx = cvs.getContext('2d');
function resizeCvs(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
window.addEventListener('resize', resizeCvs); resizeCvs();
function drawCover(img){
  var w = cvs.width, h = cvs.height;
  var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  var s = Math.max(w / iw, h / ih);
  var dw = iw * s, dh = ih * s;
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
var imgs = [], loadedCnt = 0;
for (var i = 0; i < BGS.length; i++) {
  (function(i){
    var img = new Image();
    img.onload = function(){ loadedCnt++; if (loadedCnt === BGS.length) drawCover(imgs[0]); };
    img.src = BGS[i];
    imgs.push(img);
  })(i);
}
var curIdx = 0, nextIdx = 1, fade = 1;
function tickBg(){
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  if (fade < 1) {
    ctx.globalAlpha = fade;
    drawCover(imgs[nextIdx]);
    ctx.globalAlpha = 1 - fade;
    drawCover(imgs[curIdx]);
    fade += 0.08;
    if (fade >= 1) { fade = 1; curIdx = nextIdx; }
    requestAnimationFrame(tickBg);
  } else {
    ctx.globalAlpha = 1;
    drawCover(imgs[curIdx]);
  }
}
setInterval(function(){
  nextIdx = (curIdx + 1) % BGS.length;
  fade = 0;
  requestAnimationFrame(tickBg);
}, 8000);

buildBoard();
</script>
</body>
</html>
